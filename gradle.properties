# ----------------------------------------------------------------------------
# Plugin coordinates (read by build.gradle.kts)
# ----------------------------------------------------------------------------
pluginGroup=com.soundbuild
pluginVersion=1.3.1

# Target IntelliJ Platform to build & run against.
# 2024.1.7 == build 241.*. This is the latest platform that still targets
# Java 17; IntelliJ Platform 2024.2+ (242) mandates Java 21. See README.
platformVersion=2024.1.7

# ----------------------------------------------------------------------------
# Gradle
# ----------------------------------------------------------------------------
org.gradle.jvmargs=-Xmx2g -XX:+UseParallelGC -Dfile.encoding=UTF-8
org.gradle.caching=true
org.gradle.parallel=true
# The IntelliJ Platform Gradle Plugin is not fully configuration-cache safe yet.
org.gradle.configuration-cache=false

# ----------------------------------------------------------------------------
# Kotlin
# Do NOT bundle the Kotlin standard library: the IDE already ships a matching
# copy on the classpath. Bundling our own risks a runtime version clash.
# ----------------------------------------------------------------------------
kotlin.stdlib.default.dependency=false

# ----------------------------------------------------------------------------
# IntelliJ Platform Gradle Plugin
# ----------------------------------------------------------------------------
org.jetbrains.intellij.platform.buildFeature.selfUpdateCheck=false
